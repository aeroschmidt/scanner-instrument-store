name: Secret Scanning PR warning (demo)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  informational-warning:
    name: Informational secret marker warning
    runs-on: ubuntu-latest
    steps:
      - name: Comment when the training marker is added
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- secret-scanning-pr-warning-demo -->';
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const matches = [];
            for (const file of files) {
              if (!file.patch) continue;
              let newLine = 0;
              for (const line of file.patch.split('\n')) {
                const hunk = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  newLine = Number(hunk[1]);
                  continue;
                }
                if (line.startsWith('+') && !line.startsWith('+++')) {
                  if (/^\+\s*GH_TOKEN\s*:/i.test(line)) {
                    matches.push(`- \`${file.filename}:${newLine}\` (valor omitido)`);
                  }
                  newLine++;
                } else if (!line.startsWith('-') && !line.startsWith('---')) {
                  newLine++;
                }
              }
            }

            if (matches.length === 0) {
              core.info('No training marker was added; no PR comment is needed.');
              return;
            }

            const body = [
              marker,
              '### Aviso demonstrativo de Secret Scanning',
              '',
              'O workflow encontrou no diff uma linha de teste identificada como `GH_TOKEN`. O valor foi omitido do comentário.',
              '',
              ...matches,
              '',
              '> Este é um aviso informativo criado por GitHub Actions para demonstração. Ele não valida a credencial nem representa um alerta nativo do Secret Scanning. O workflow não reprova o PR e não bloqueia o merge.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }
