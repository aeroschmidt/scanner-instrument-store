name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check the Secret Scanning demo marker
        shell: bash
        run: |
          if grep -R -n --fixed-strings 'DEMO_SECRET_SCANNING_BLOCK_MERGE' docs/security; then
            echo '::error::Demonstration marker found. This required PR check is intentionally failing.'
            exit 1
          fi
          echo 'No demonstration marker found.'

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown