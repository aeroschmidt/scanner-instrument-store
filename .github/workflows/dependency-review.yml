name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    # Temporarily disabled: the current rollout uses Dependabot for dependency visibility only.
    # Keep the required check context; GitHub reports a conditionally skipped job as successful.
    # Remove this condition when Dependency Review enforcement is intentionally enabled again.
    if: ${{ false }}
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
