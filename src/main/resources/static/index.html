<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101828">
    <title>Sound &amp; String | Musical Instruments</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="Sound and String, home"><span class="brand-mark">♪</span> sound<span>&amp;</span>string</a>
    <span class="top-note">Made for people who live for music</span>
</header>
<main class="layout">
    <section class="intro">
        <p class="eyebrow">STORE CATALOG</p>
        <h1>Your next sound starts here.</h1>
        <p>Instruments and accessories selected to bring every idea to life.</p>
    </section>
    <section class="inventory" aria-labelledby="inventory-title">
        <div class="section-heading">
            <div><p class="eyebrow">INVENTORY</p><h2 id="inventory-title">Available instruments</h2></div>
            <button class="primary-button" id="new-product" type="button">＋ Add product</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="product-grid" class="product-grid" aria-live="polite"></div>
    </section>
</main>
<dialog id="product-dialog">
    <form id="product-form">
        <div class="dialog-heading"><div><p class="eyebrow">PRODUCT DETAILS</p><h2 id="dialog-title">New instrument</h2></div><button class="icon-button" type="button" id="close-dialog" aria-label="Close">×</button></div>
        <input type="hidden" id="product-id">
        <label for="name">Name</label><input id="name" name="name" required maxlength="120" placeholder="e.g., Acoustic guitar">
        <label for="category">Category</label><input id="category" name="category" required maxlength="60" placeholder="e.g., Strings">
        <div class="form-row"><div><label for="price">Price (BRL)</label><input id="price" name="price" type="number" min="0" step="0.01" required></div><div><label for="stock">Units in stock</label><input id="stock" name="stock" type="number" min="0" step="1" required></div></div>
        <div class="dialog-actions"><button class="secondary-button" type="button" id="cancel-dialog">Cancel</button><button class="primary-button" type="submit">Save product</button></div>
    </form>
</dialog>
<footer>Sound &amp; String <span>•</span> local Java, Maven, and SonarQube demo</footer>
</body>
</html>
